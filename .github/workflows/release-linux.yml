name: release-linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: .deb (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: echo "value=$(grep -m1 '^version' rust/Cargo.toml | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev librsvg2-dev build-essential pkg-config curl file dpkg-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: rust
        run: cargo build --release --workspace --locked

      - name: Package
        run: VERSION="${{ steps.version.outputs.value }}" bash packaging/linux/package-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    name: .rpm (Fedora container)
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - name: System dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make git tar gzip xz pkgconf-pkg-config rpm-build \
            webkit2gtk4.1-devel gtk3-devel libxdo-devel librsvg2-devel
          dnf install -y --setopt=install_weak_deps=False libappindicator-gtk3-devel \
            || dnf install -y --setopt=install_weak_deps=False libayatana-appindicator-gtk3-devel

      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: echo "value=$(grep -m1 '^version' rust/Cargo.toml | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: rust
        run: cargo build --release --workspace --locked

      - name: Package
        run: VERSION="${{ steps.version.outputs.value }}" bash packaging/linux/package-rpm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm
          if-no-files-found: error

  publish:
    name: attach to release
    needs: [deb, rpm]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/deb/*.deb
            artifacts/rpm/*.rpm
