[package]
name = "mystique-ui"
description = "Desktop control panel for the DeepCool MYSTIQUE AIO LCD."
version.workspace = true
edition.workspace = true
# Tauri 2 requires Rust 1.90; the rest of the workspace still targets 1.85.
rust-version = "1.90"
license.workspace = true
publish.workspace = true

[[bin]]
name = "mystique-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mystique-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tokio.workspace = true

[features]
# Embed the static `ui/` directory in the binary. No dev server, no Node toolchain.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Linux tray: force tray-icon's StatusNotifierItem backend (ksni) instead of the
# default libappindicator one. libappindicator is menu-only and never reports a
# click, so left-clicking the tray could not open the window; ksni maps Activate
# to a left click and keeps the menu on right click. Cargo unifies features, so
# this does not remove libappindicator — tray-icon picks ksni whenever it is on.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25", features = ["ksni"] }
