[workspace]
resolver = "2"
members = [
    "crates/mystique-protocol",
    "crates/mystique-usb",
    "crates/mystique-sensors",
    "crates/mystique-media",
    "crates/mystique-ipc",
    "crates/mystique-cli",
    "apps/mystique-ui",
    "apps/mystique-daemon",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
mystique-protocol = { path = "crates/mystique-protocol" }
mystique-usb = { path = "crates/mystique-usb" }
mystique-sensors = { path = "crates/mystique-sensors" }
mystique-media = { path = "crates/mystique-media" }
mystique-ipc = { path = "crates/mystique-ipc" }

clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
md-5 = "0.10"
rusb = { version = "0.9", features = ["vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
thiserror = "2.0"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "signal",
    "time",
    "macros",
] }

[profile.release]
debug = "line-tables-only"
